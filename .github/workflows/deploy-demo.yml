name: Deploy Demo to Pages

on:
  push:
    branches:
      - main
    paths:
      - 'theme/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SITE_URL: 'https://freelance-persona.github.io'
  BASE_PATH: '/astro-freelance-persona_theme'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Setup Playground
        run: bun run playground:setup

      # Google Search Console verification, CI-only: the token never
      # touches the repo. GSC HTML-file verification expects
      # google<token>.html at the site root with a self-referencing
      # content line; both derive from the single secret. Inert when the
      # secret is unset.
      - name: Google Search Console verification (CI-only)
        env:
          GSC_TOKEN: ${{ secrets.GSC_SITE_VERIFICATION }}
        run: |
          if [ -n "$GSC_TOKEN" ]; then
            mkdir -p playground/public
            printf 'google-site-verification: google%s.html' "$GSC_TOKEN" \
              > "playground/public/google${GSC_TOKEN}.html"
            echo "GSC verification file written"
          else
            echo "no GSC token configured — skipping"
          fi

      - name: Build Demo Site
        run: bun run build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./playground/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
