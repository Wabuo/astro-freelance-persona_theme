name: Renovate
on:
  workflow_dispatch:
  schedule:
    # Run daily at 03:27 UTC (using a non-zero minute to avoid top-of-the-hour GitHub Actions queue spikes)
    - cron: '27 3 * * *'

concurrency: renovate

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Host Egress Traffic
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Renovate Agent
        uses: renovatebot/github-action@5402b206248e5a8c8427a15102702eb9c1793efc # v46.2.4
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
